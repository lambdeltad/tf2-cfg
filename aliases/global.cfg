alias thanks voicemenu 0 1
// alias go_go_go voicemenu 0 2
// alias move_up voicemenu 0 3
alias go_left voicemenu 0 4
alias go_right voicemenu 0 5
alias yes voicemenu 0 6
alias no voicemenu 0 7
alias incoming voicemenu 1 0
alias spy_warning voicemenu 1 1
alias sentry_ahead voicemenu 1 2
alias teleporter_here voicemenu 1 3
alias dispenser_here voicemenu 1 4
alias sentry_here voicemenu 1 5
alias activate_uber voicemenu 1 6
alias uber_ready voicemenu 1 7
alias need_help voicemenu 2 0
// alias battlecry voicemenu 2 1
// alias cheers voicemenu 2 2
// alias jeers voicemenu 2 3
alias positive voicemenu 2 4
alias negative voicemenu 2 5
alias nice_shot voicemenu 2 6
alias good_job voicemenu 2 7

///////////////////////////////////////////////////////////
// -------------- Null-Canceling Movement -------------- //
///////////////////////////////////////////////////////////

alias check_forward
alias check_back
alias check_left
alias check_right
alias +mfwd "-back; +forward; alias check_forward +forward"
alias -mfwd "-forward; check_back; alias check_forward"
alias +mback "-forward; +back; alias check_back +back"
alias -mback "-back; check_forward; alias check_back"
alias +mleft "-moveright; +moveleft; alias check_left +moveleft"
alias -mleft "-moveleft; check_right; alias check_left"
alias +mright "-moveleft; +moveright; alias check_right +moveright"
alias -mright "-moveright; check_left; alias check_right"

///////////////////////////////////////////////////////////
// ---------------- Classes & Loadouts ----------------- //
///////////////////////////////////////////////////////////

alias scout "join_class scout"
alias soldier "join_class soldier"
alias pyro "join_class pyro"
alias demoman "join_class demoman"
alias heavy "join_class heavyweapons"
alias engineer "join_class engineer"
alias medic "join_class medic"
alias sniper "join_class sniper"
alias spy "join_class spy"

alias exec_class_cfg

alias +class_menu "bind 1 scout; bind 2 soldier; bind 3 pyro; bind 4 demoman; bind 5 heavy; bind 6 engineer; bind 7 medic; bind 8 sniper; bind 9 spy; alias class_menu_state +class_menu"
alias -class_menu "rebind_1;     rebind_2;       rebind_3;    rebind_4;       rebind_5;     rebind_6;        rebind_7;     rebind_8;      rebind_9;   alias class_menu_state"

alias ldt_A "load_itempreset 0"
alias ldt_B "load_itempreset 1"
alias ldt_C "load_itempreset 2"
alias ldt_D "load_itempreset 3"
alias ldt_refresh

alias +ldt_menu "+class_menu; bind MOUSE1 ldt_A; bind MOUSE2 ldt_D; bind MOUSE3 open_charinfo_direct; bind MWHEELUP ldt_B; bind MWHEELDOWN ldt_C; bind MOUSE4 ldt_refresh; bind MOUSE5 kill"
alias -ldt_menu "-class_menu; rebind_MOUSE1;     rebind_MOUSE2;     rebind_MOUSE3;                    rebind_MWHEELUP;     rebind_MWHEELDOWN;     rebind_MOUSE4;           rebind_MOUSE5"

///////////////////////////////////////////////////////////
// ----------------------- Coms ------------------------ //
///////////////////////////////////////////////////////////

alias comms_menu_1_A "bind MOUSE1 yes; bind MOUSE2 no;  bind MOUSE3 thanks; bind MWHEELUP go_left; bind MWHEELDOWN go_right; bind MOUSE4 spy_warning; bind MOUSE5 sentry_ahead"
alias comms_menu_0_A "rebind_MOUSE1;   rebind_MOUSE2;   rebind_MOUSE3;      rebind_MWHEELUP;       rebind_MWHEELDOWN;        rebind_MOUSE4;           rebind_MOUSE5"

alias comms_menu_1_B "bind q incoming; bind e activate_uber; bind 1 positive; bind 2 negative; bind 3 nice_shot; bind 4 good_job"
alias comms_menu_0_B "rebind_q;        rebind_e;             rebind_1;        rebind_2;        rebind_3;         rebind_4"

alias +comms_menu "comms_menu_1_A; comms_menu_1_B"
alias -comms_menu "comms_menu_0_A; comms_menu_0_B"

alias coms_1 "hud_saytext_time 12; voice_enable 1; alias coms_toggle coms_0; echo Comms->ON;"
alias coms_0 "hud_saytext_time 0;  voice_enable 0; alias coms_toggle coms_1; echo Comms->OFF;"

alias mvm_tip1 "say BOOOOOMB!"
alias mvm_tip2 "say TAAAAANK!"
alias mvm_tip3 "say Heavy's Miniguns have a -75% damage penalty against tanks, please defend the bomb"
alias mvm_tip4 "say Don't shoot the medics, let our Demoman/Sniper drop the ubers"
alias mvm_tip5 "say Teleporter compromised, don't take it"
alias mvm_tiphelp "echo 1=Bomb,2=Tank,3=HeavyNoTank,4=DropMeds,5=TeleTrap;"

alias +mvm_tip_menu "bind ` mvm_tiphelp; bind 1 mvm_tip1; bind 2 mvm_tip2; bind 3 mvm_tip3; bind 4 mvm_tip4; bind 5 mvm_tip5"
alias -mvm_tip_menu "rebind_BACKTICK;    rebind_1;        rebind_2;        rebind_3;        rebind_4;        rebind_5"

///////////////////////////////////////////////////////////
// ----------------------- Misc. ----------------------- //
///////////////////////////////////////////////////////////

alias resync "record fix"
alias spray "impulse 201"

alias +afk "alias afk_end afk; afk_end"
alias -afk "alias afk_end"
alias afk "+moveleft; wait 300; -moveleft; +moveright; wait 300; -moveright; afk_end"

///////////////////////////////////////////////////////////
// ---------------------- Tempus ----------------------- //
///////////////////////////////////////////////////////////

alias +fire_walk "+attack; +mfwd"
alias -fire_walk "-attack; rebind_MOUSE1"
alias fire_walk "bind MOUSE1 +fire_walk"

alias fire_walk_1 "alias rebind_MOUSE5 "bind MOUSE5 fire_walk"; rebind_MOUSE5; alias fire_walk_state fire_walk_1; alias fire_walktoggle fire_walk_0; echo Fire_Walk->ON;"
alias fire_walk_0 "alias rebind_MOUSE5 "unbind MOUSE5";         rebind_MOUSE5; alias fire_walk_state;             alias fire_walktoggle fire_walk_1; echo Fire_Walk->OFF;"

alias tempus_binds_1_A "bind F1 sm_r; bind F2 sm_t; bind F3 sm_timer; alias rebind_q "unbind q";         rebind_q; alias rebind_e "unbind e";       rebind_e"
alias tempus_binds_0_A "rebind_F1;    rebind_F2;    rebind_F3;        alias rebind_q "bind q need_help"; rebind_q; alias rebind_e "bind e +helpme"; rebind_e"
alias tempus_binds_1_B "bind y sm_hide; bind u sm_hud; bindtoggle i cl_autoreload 0 1"
alias tempus_binds_0_B "rebind_y;       rebind_u;      rebind_i"
alias tempus_1 "tempus_binds_1_A; tempus_binds_1_B; cl_autoreload 0; tf_use_match_hud 0; fire_walk_1; echo Tempus_Settings->ON;"
alias tempus_0 "tempus_binds_0_A; tempus_binds_0_B; cl_autoreload 1; tf_use_match_hud 1; fire_walk_0; echo Tempus_Settings->OFF;"

///////////////////////////////////////////////////////////
// ---------------------- General --------------------- //
///////////////////////////////////////////////////////////

alias toggles_default "coms_1; beggars_spam_0; sticky_spam_0; fast_revive_unlock_0; vacc_wheel_0; vacc_123_0; auto_disguise_0; tempus_0"
alias toggles_mvm     "coms_1; beggars_spam_1; sticky_spam_1; fast_revive_unlock_1; vacc_wheel_0; vacc_123_0; auto_disguise_1; tempus_0"
alias toggles_tempus  "coms_1; beggars_spam_0; sticky_spam_0; fast_revive_unlock_0; vacc_wheel_0; vacc_123_0; auto_disguise_0; tempus_1"

alias bind_config_casual  "echo BIND_CONFIG->CASUAL;  toggles_default; alias ldt_scout ldt_A; alias ldt_soldier ldt_A; alias ldt_pyro ldt_A; alias ldt_demoman ldt_A; alias ldt_heavy ldt_A; alias ldt_engineer ldt_A; alias ldt_medic ldt_A; alias ldt_sniper ldt_A; alias ldt_spy ldt_A; alias ldt_refresh ldt_A; exec_class_cfg"
alias bind_config_mvm     "echo BIND_CONFIG->MVM;     toggles_mvm;     alias ldt_scout ldt_D; alias ldt_soldier ldt_D; alias ldt_pyro ldt_D; alias ldt_demoman ldt_D; alias ldt_heavy ldt_D; alias ldt_engineer ldt_D; alias ldt_medic ldt_D; alias ldt_sniper ldt_D; alias ldt_spy ldt_D; alias ldt_refresh ldt_D; exec_class_cfg"
alias bind_config_tempus  "echo BIND_CONFIG->TEMPUS;  toggles_tempus;  alias ldt_scout;       alias ldt_soldier ldt_B; alias ldt_pyro;       alias ldt_demoman;       alias ldt_heavy;       alias ldt_engineer;       alias ldt_medic;       alias ldt_sniper;       alias ldt_spy;       alias ldt_refresh;       exec_class_cfg"
alias bind_config_default "echo BIND_CONFIG->DEFAULT; toggles_default; alias ldt_scout;       alias ldt_soldier;       alias ldt_pyro;       alias ldt_demoman;       alias ldt_heavy;       alias ldt_engineer;       alias ldt_medic;       alias ldt_sniper;       alias ldt_spy;       alias ldt_refresh;       exec_class_cfg"

echo "Global aliases loaded"
