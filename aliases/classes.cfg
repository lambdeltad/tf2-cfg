// ---------------------- Engineer --------------------- //
///////////////////////////////////////////////////////////

alias build_menu "use tf_weapon_pda_engineer_build"
alias destroy_menu "use tf_weapon_pda_engineer_destroy"

alias dab_sentry "destroy 2; build 2"
alias dab_dispenser "destroy 0; build 0"
alias dab_entrance "destroy 1; build 1"
alias dab_exit "destroy 3; build 3"

alias +dab_menu "bind 1 dab_sentry; bind 2 dab_dispenser; bind 3 dab_entrance; bind 4 dab_exit"
alias -dab_menu "rebind_1; rebind_2; rebind_3; rebind_4"

