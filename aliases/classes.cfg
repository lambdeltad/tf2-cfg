// C-TAP WITHOUT THE TAP
alias auto_reduck
alias +auto_reduck "+duck 1; alias auto_reduck +duck 1"
alias -auto_reduck "-duck 1; alias auto_reduck"
alias +unduck_jump "-duck 1; +jump 1"
alias -unduck_jump "-jump 1; auto_reduck"

// BEGGAR'S BAZOOKA SPAM
alias +beggars_spam "alias beggars_spam_end beggars_spam_start; beggars_spam_end"
alias -beggars_spam "alias beggars_spam_end"
alias beggars_spam_start "+attack; wait 3; -attack; wait 3; beggars_spam_end"

alias beggars_spam_1 "alias rebind_MOUSE4 "bind MOUSE4 +beggars_spam"; rebind_MOUSE4; alias beggars_spam_state beggars_spam_1; alias beggars_spam_toggle beggars_spam_0; echo Beggars_Spam->ON;"
alias beggars_spam_0 "alias rebind_MOUSE4 "bind MOUSE4 +attack2";      rebind_MOUSE4; alias beggars_spam_state;                alias beggars_spam_toggle beggars_spam_1; echo Beggars_Spam->OFF;"

