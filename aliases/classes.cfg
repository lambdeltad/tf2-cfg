alias +det_reload "+attack2; +reload"
alias -det_reload "-attack2; -reload"

// STICKIES AUTO SPAM
alias +sticky_spam "alias sticky_spam_end sticky_spam_start; sticky_spam_end"
alias -sticky_spam "alias sticky_spam_end"
alias sticky_spam_start "+attack; wait 9; -attack; wait 9; sticky_spam_end"

alias sticky_spam_1 "alias rebind_MOUSE4 "bind MOUSE4 +sticky_spam"; rebind_MOUSE4; alias sticky_spam_state sticky_spam_1; alias sticky_spam_toggle sticky_spam_0; echo Sticky_Spam->ON;"
alias sticky_spam_0 "alias rebind_MOUSE4 "bind MOUSE4 +attack2";     rebind_MOUSE4; alias sticky_spam_state;               alias sticky_spam_toggle sticky_spam_1; echo Sticky_Spam->OFF;"

