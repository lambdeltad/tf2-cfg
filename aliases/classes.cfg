// FAST REVIVE
alias +fast_revive "alias fast_revive_end fast_revive_start; fast_revive_end"
alias -fast_revive "alias fast_revive_end"

alias fast1_revive_start "wait 6; +attack; wait 6; -attack; wait 6; fast_revive_end"
alias fast2_revive_start "wait 9; +attack; wait 9; -attack; wait 9; fast_revive_end"
alias fast_revive_start fast1_revive_start

alias +fast2_revive_rate "alias fast_revive_start fast2_revive_start"
alias -fast2_revive_rate "alias fast_revive_start fast1_revive_start"

alias +fast_revive_unlock "alias rebind_CTRL "bind MOUSE1 +fast_revive"; rebind_CTRL; +duck"
alias -fast_revive_unlock "alias rebind_CTRL "bind MOUSE1 +attack";      rebind_CTRL; -duck; -fast_revive"

alias fast_revive_unlock_1 "alias rebind_SHIFT "bind SHIFT +fast_revive_unlock"; rebind_SHIFT; alias rebind_MOUSE5 "bind MOUSE5 +fast2_revive_rate"; rebind_MOUSE5; alias fast_revive_unlock_state fast_revive_unlock_1; alias fast_revive_unlock_toggle fast_revive_unlock_0; echo Fast_Revive->ON;"
alias fast_revive_unlock_0 "alias rebind_SHIFT "bind SHIFT +duck";               rebind_SHIFT; alias rebind_MOUSE5 "unbind MOUSE5";                  rebind_MOUSE5; alias fast_revive_unlock_state;                      alias fast_revive_unlock_toggle fast_revive_unlock_1; echo Fast_Revive->OFF;"

// VACCINATOR MWHEEL SWITCH
alias reload1 "+reload; wait 10; -reload"
alias reload2 "+reload; wait 10; -reload; wait 10; +reload; wait 10; -reload"

alias vacc_wheel_binds_1 "alias rebind_MWHEELUP "bind MWHEELUP reload2"; rebind_MWHEELUP; alias rebind_MWHEELDOWN "bind MWHEELDOWN reload1"; rebind_MWHEELDOWN"
alias vacc_wheel_binds_0 "alias rebind_MWHEELUP "bind MWHEELUP slot1";   rebind_MWHEELUP; alias rebind_MWHEELDOWN "bind MWHEELDOWN slot3";   rebind_MWHEELDOWN"
alias vacc_wheel_1 "vacc_123_0; vacc_wheel_binds_1; alias vacc_wheel_state vacc_wheel_1; alias vacc_wheel_toggle vacc_wheel_0; echo Vacc_Wheel->ON;"
alias vacc_wheel_0             "vacc_wheel_binds_0; alias vacc_wheel_state;              alias vacc_wheel_toggle vacc_wheel_1; echo Vacc_Wheel->OFF;"

// VACCINATOR 1 2 3 SWITCH
alias vacc_123_reset "alias vacc_123_2bull; alias vacc_123_2blst; alias vacc_123_2fire"
alias vacc_123_lock "unbind MWHEELUP; unbind MWHEELDOWN"
alias vacc_123_unlock "rebind_MWHEELUP; rebind_MWHEELDOWN"

alias vacc_123_bull2blst   "vacc_123_reset; vacc_123_lock; slot2; reload1; wait 20; vacc_123_unlock; vacc_123_blst"
alias vacc_123_blst2fire   "vacc_123_reset; vacc_123_lock; slot2; reload1; wait 20; vacc_123_unlock; vacc_123_fire"
alias vacc_123_fire2bull   "vacc_123_reset; vacc_123_lock; slot2; reload1; wait 20; vacc_123_unlock; vacc_123_bull"
alias vacc_123_bull2fire   "vacc_123_reset; vacc_123_lock; slot2; reload2; wait 40; vacc_123_unlock; vacc_123_fire"
alias vacc_123_blst2bull   "vacc_123_reset; vacc_123_lock; slot2; reload2; wait 40; vacc_123_unlock; vacc_123_bull"
alias vacc_123_fire2blst   "vacc_123_reset; vacc_123_lock; slot2; reload2; wait 40; vacc_123_unlock; vacc_123_blst"
alias vacc_123_bull2blst_2 "vacc_123_reset; vacc_123_lock; slot2; wait 300; reload1; wait 20; vacc_123_unlock; vacc_123_blst"
alias vacc_123_blst2fire_2 "vacc_123_reset; vacc_123_lock; slot2; wait 300; reload1; wait 20; vacc_123_unlock; vacc_123_fire"
alias vacc_123_fire2bull_2 "vacc_123_reset; vacc_123_lock; slot2; wait 300; reload1; wait 20; vacc_123_unlock; vacc_123_bull"
alias vacc_123_bull2fire_2 "vacc_123_reset; vacc_123_lock; slot2; wait 300; reload2; wait 40; vacc_123_unlock; vacc_123_fire"
alias vacc_123_blst2bull_2 "vacc_123_reset; vacc_123_lock; slot2; wait 300; reload2; wait 40; vacc_123_unlock; vacc_123_bull"
alias vacc_123_fire2blst_2 "vacc_123_reset; vacc_123_lock; slot2; wait 300; reload2; wait 40; vacc_123_unlock; vacc_123_blst"
alias vacc_123_wheel2bull  "vacc_123_reset; vacc_123_lock; slot2; wait 300; vacc_123_unlock; vacc_123_bull"
alias vacc_123_wheel2blst  "vacc_123_reset; vacc_123_lock; slot2; wait 300; vacc_123_unlock; vacc_123_blst"
alias vacc_123_wheel2fire  "vacc_123_reset; vacc_123_lock; slot2; wait 300; vacc_123_unlock; vacc_123_fire"

alias vacc_123_bull "alias vacc_123_2bull slot2; alias vacc_123_2blst vacc_123_bull2blst; alias vacc_123_2fire vacc_123_bull2fire; alias vacc_123_from vacc_123_from_bull"
alias vacc_123_blst "alias vacc_123_2blst slot2; alias vacc_123_2fire vacc_123_blst2fire; alias vacc_123_2bull vacc_123_blst2bull; alias vacc_123_from vacc_123_from_blst"
alias vacc_123_fire "alias vacc_123_2fire slot2; alias vacc_123_2bull vacc_123_fire2bull; alias vacc_123_2blst vacc_123_fire2blst; alias vacc_123_from vacc_123_from_fire"
alias vacc_123_from_bull "alias vacc_123_2bull vacc_123_wheel2bull; alias vacc_123_2blst vacc_123_bull2blst_2; alias vacc_123_2fire vacc_123_bull2fire_2; alias vacc_123_from vacc_123_from_bull"
alias vacc_123_from_blst "alias vacc_123_2blst vacc_123_wheel2blst; alias vacc_123_2fire vacc_123_blst2fire_2; alias vacc_123_2bull vacc_123_blst2bull_2; alias vacc_123_from vacc_123_from_blst"
alias vacc_123_from_fire "alias vacc_123_2fire vacc_123_wheel2fire; alias vacc_123_2bull vacc_123_fire2bull_2; alias vacc_123_2blst vacc_123_fire2blst_2; alias vacc_123_from vacc_123_from_fire"
alias vacc_123_slot1_alias "slot1; vacc_123_from; alias vacc_123_from"
alias vacc_123_slot3_alias "slot3; vacc_123_from; alias vacc_123_from"

alias vacc_123_binds_1_A "alias rebind_MWHEELUP "bind MWHEELUP vacc_123_slot1_alias"; rebind_MWHEELUP; alias rebind_MWHEELDOWN "bind MWHEELDOWN vacc_123_slot3_alias"; rebind_MWHEELDOWN"
alias vacc_123_binds_0_A "alias rebind_MWHEELUP "bind MWHEELUP slot1";                rebind_MWHEELUP; alias rebind_MWHEELDOWN "bind MWHEELDOWN slot3";                rebind_MWHEELDOWN"
alias vacc_123_binds_1_B "alias rebind_1 "bind 1 vacc_123_2bull"; rebind_1; alias rebind_2 "bind 2 vacc_123_2blst"; rebind_2; alias rebind_3 "bind 3 vacc_123_2fire"; rebind_3"
alias vacc_123_binds_0_B "alias rebind_1 "bind 1 slot1";          rebind_1; alias rebind_2 "bind 2 slot2";          rebind_2; alias rebind_3 "bind 3 slot3";          rebind_3"

alias vacc_123_1 "vacc_wheel_0; vacc_123_bull; vacc_123_binds_1_A; vacc_123_binds_1_B; alias vacc_123_state vacc_123_1; alias vacc_123_toggle vacc_123_0; echo Vacc_123->ON;"
alias vacc_123_0                              "vacc_123_binds_0_A; vacc_123_binds_0_B; alias vacc_123_state;            alias vacc_123_toggle vacc_123_1; echo Vacc_123->OFF;"

